<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Under The C</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; }
    pre { margin: 16px; color: #c0c0c0; font: 16px monospace; white-space: pre-wrap; }
    #settings-gear {
      position: fixed;
      top: 8px;
      left: 8px;
      width: 28px;
      height: 28px;
      padding: 0;
      border: none;
      background: none;
      cursor: pointer;
      z-index: 10;
    }
    #settings-gear svg { width: 100%; height: 100%; fill: #808080; transition: fill .15s ease; }
    #settings-gear:hover svg { fill: #fff; }
    #settings-gear[hidden] { display: none; }
  </style>
</head>
<body>
<canvas id="tank"></canvas>
<button id="settings-gear" type="button" title="Settings" aria-label="Settings">
  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.3 7.3 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54a7.3 7.3 0 0 0-1.63.94l-2.39-.96a.5.5 0 0 0-.61.22L2.63 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.42.32.61.22l2.39-.96c.5.4 1.05.72 1.63.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .45-.18.5-.42l.36-2.54c.58-.22 1.13-.54 1.63-.94l2.39.96c.24.1.47.02.61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/>
  </svg>
</button>
<pre id="error" hidden></pre>
<script src="underthec.js"></script>
<script>
"use strict";
/* [long, short], long wins */
const OPTIONS = [
  ["classic",          "c"],
  ["aquatic-life",     "a"],
  ["message",          "m"],
  ["message-color",    "M"],
  ["message-position", "P"],
  ["pace",             "p"],
  ["uturn-chance",     "u"],
  ["colors",           "C"],
  ["fps",              "f"],
  ["castle-name",      "n"],
];
const FONT_PX = 16;
const FONT = FONT_PX + "px monospace";
const FONT_BOLD = "bold " + FONT;
/* index: enum color. [normal, bold]. bg: [40-47, 100-107] */
const PALETTE = [
  ["#c0c0c0", "#ffffff"], ["#000000", "#808080"], ["#c00000", "#ff5555"],
  ["#00c000", "#55ff55"], ["#c0c000", "#ffff55"], ["#0000c0", "#5555ff"],
  ["#c000c0", "#ff55ff"], ["#00c0c0", "#55ffff"], ["#c0c0c0", "#ffffff"],
];

/* TERM_KEY_* in term.h */
const KEYS = { ArrowUp: -2, ArrowDown: -3, ArrowLeft: -4, ArrowRight: -5, Escape: 27 };

const canvas = document.getElementById("tank");
const ctx = canvas.getContext("2d");
const gear = document.getElementById("settings-gear");
let cellW = 0;
let cellH = 0;
let cols = 0;
let rows = 0;

const SETTINGS_KEY = "s".charCodeAt(0);

function measure() {
  ctx.font = FONT;
  cellW = Math.ceil(ctx.measureText("M").width);
  cellH = Math.ceil(FONT_PX * 1.2);
}

function layout(M) {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.floor(window.innerWidth * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);
  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  measure();
  ctx.textBaseline = "top";
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
  M._web_resize(Math.max(1, Math.floor(window.innerWidth / cellW)), Math.max(1, Math.floor(window.innerHeight / cellH)));
  cols = M._web_width();
  rows = M._web_height();
}

function present(M, ptr) {
  const cells = M.HEAPU32.subarray(ptr >>> 2, (ptr >>> 2) + cols * rows);
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
  for (let i = 0; i < cells.length; i++) {
    const bg = (cells[i] >>> 5) & 0xf;
    if (bg === 0) continue;
    ctx.fillStyle = PALETTE[bg][(cells[i] >>> 9) & 1];
    ctx.fillRect((i % cols) * cellW, Math.floor(i / cols) * cellH, cellW, cellH);
  }
  let font = null;
  for (let i = 0; i < cells.length; i++) {
    const v = cells[i];
    const cp = v >>> 10;
    if (cp === 0 || cp === 0x20) continue;
    const bold = v & 1;
    const f = bold ? FONT_BOLD : FONT;
    if (f !== font) {
      ctx.font = f;
      font = f;
    }
    ctx.fillStyle = PALETTE[(v >>> 1) & 0xf][bold];
    ctx.fillText(String.fromCodePoint(cp), (i % cols) * cellW, Math.floor(i / cols) * cellH);
  }
}

function applyOptions(M) {
  const params = new URLSearchParams(window.location.search);
  if (params.has("no-castle")) {
    const e = M.ccall("web_opt", "string", ["string", "string", "string"], ["no-castle", "1", "no-castle"]);
    if (e) return e;
  }
  for (const [long, short] of OPTIONS) {
    const shown = params.has(long) ? long : params.has(short) ? short : null;
    if (shown === null) continue;
    const e = M.ccall("web_opt", "string", ["string", "string", "string"], [long, params.get(shown), shown]);
    if (e) return e;
  }
  return M.ccall("web_init", "string", ["number"], [performance.now()]);
}

function showError(msg) {
  canvas.style.display = "none";
  const pre = document.getElementById("error");
  pre.textContent = "underthec: " + msg;
  pre.hidden = false;
}

underthec().then((M) => {
  const e = applyOptions(M);
  if (e) {
    showError(e);
    return;
  }
  function syncGear() {
    gear.hidden = !!M._web_settings_open();
  }
  layout(M);
  syncGear();
  window.addEventListener("resize", () => layout(M));
  window.addEventListener("keydown", (e) => {
    let key = KEYS[e.key];
    if (key === undefined && e.key.length === 1) key = e.key.toLowerCase().charCodeAt(0);
    if (key === undefined) return;
    if (key < 0 || e.key === " ") e.preventDefault();
    M._web_key(key);
    syncGear();
  });
  gear.addEventListener("click", () => {
    M._web_key(SETTINGS_KEY);
    syncGear();
  });
  canvas.addEventListener("pointerdown", (e) => {
    M._web_click(Math.floor(e.offsetX / cellW), Math.floor(e.offsetY / cellH));
    syncGear();
  });
  let next = performance.now();
  function tick(now) {
    if (now >= next) {
      const period = 1000 / M._web_fps();
      next = Math.max(next + period, now - period);
      present(M, M._web_frame(now));
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
});
</script>
</body>
</html>
