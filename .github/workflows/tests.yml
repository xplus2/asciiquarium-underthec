name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: cppcheck
        run: |
          set -o pipefail
          cppcheck --enable=warning,performance,portability --std=c11 --inline-suppr \
            --suppress=missingIncludeSystem --error-exitcode=1 -I src --quiet src/ \
            2>&1 | tee cppcheck-report.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cppcheck-report
          path: cppcheck-report.txt

  android-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21 -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-Werror
      - run: cmake --build build -j

  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxft-dev qt6-base-dev qt6-declarative-dev
      - run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DUNDERTHEC_STATIC=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_MODULE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build build -j
      - name: smoke run under asan/ubsan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          for args in "" "-c" "-m hi"; do
            echo "=== underthec $args ==="
            script -qec "timeout --preserve-status -s TERM 5 build/underthec $args" /dev/null
          done
