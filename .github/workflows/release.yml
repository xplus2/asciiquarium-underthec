name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: get
        run: |
          ver=$(grep -oP '(?<=TOOL_VERSION ")[^"]+' src/version.h)
          echo "version=$ver" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y musl-tools libx11-dev libxft-dev qt6-base-dev qt6-declarative-dev
      - run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=toolchain/musl-toolchain.cmake -DCMAKE_BUILD_TYPE=Release -DUNDERTHEC_PLASMA_WALLPAPER=OFF
      - run: cmake --build build -j
      - name: build xscreensaver and plasma wallpaper (native, not musl - X11 and Qt have no static archives)
        run: |
          cmake -S . -B build-xscr -DCMAKE_BUILD_TYPE=Release
          cmake --build build-xscr -j --target underthec_xscr plasma_wallpaper
      - run: |
          ver=${{ needs.version.outputs.version }}
          name=underthec-${ver}-linux-${{ matrix.arch }}
          mkdir "$name"
          cp build/underthec build/underthec.so build-xscr/underthec_xscr src/target/scr_x11/underthec.xml LICENSE "$name"/
          cp -r build-xscr/plasma_wallpaper "$name"/
          tar -czf "${name}.tar.gz" "$name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-${{ matrix.arch }}
          path: underthec-*-linux-${{ matrix.arch }}.tar.gz

  linux-musl-cross:
    needs: version
    strategy:
      matrix:
        include:
          - arch: armhf
            compiler: arm-linux-musleabihf-gcc
            zigtarget: arm-linux-musleabihf
            toolchain: toolchain/arm-linux-musleabihf-toolchain.cmake
          - arch: armel
            compiler: arm-linux-musleabi-gcc
            zigtarget: arm-linux-musleabi
            toolchain: toolchain/arm-linux-musleabi-toolchain.cmake
          - arch: i386
            compiler: i686-linux-musl-gcc
            zigtarget: x86-linux-musl
            toolchain: toolchain/i686-linux-musl-toolchain.cmake
          - arch: riscv64
            compiler: riscv64-linux-musl-gcc
            zigtarget: riscv64-linux-musl
            toolchain: toolchain/riscv64-linux-musl-toolchain.cmake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: install zig cross toolchain
        run: |
          curl -sSLf -o zig.tar.xz "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz"
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  zig.tar.xz" | sha256sum -c -
          sudo tar -xJf zig.tar.xz -C /opt
          sudo mkdir -p /opt/zig-wrappers
          printf '#!/bin/sh\nexec /opt/zig-x86_64-linux-0.16.0/zig cc -target %s "$@"\n' "${{ matrix.zigtarget }}" | sudo tee "/opt/zig-wrappers/${{ matrix.compiler }}" >/dev/null
          sudo chmod +x "/opt/zig-wrappers/${{ matrix.compiler }}"
          echo "/opt/zig-wrappers" >> "$GITHUB_PATH"
      - run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=${{ matrix.toolchain }} -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j
      - run: |
          ver=${{ needs.version.outputs.version }}
          name=underthec-${ver}-linux-${{ matrix.arch }}
          mkdir "$name"
          cp build/underthec build/underthec.so LICENSE "$name"/
          tar -czf "${name}.tar.gz" "$name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-${{ matrix.arch }}
          path: underthec-*-linux-${{ matrix.arch }}.tar.gz

  macos-arm64:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j
      - run: |
          ver=${{ needs.version.outputs.version }}
          name=underthec-${ver}-macos-arm64
          mkdir "$name"
          cp -R build/underthec build/underthec.saver LICENSE "$name"/
          tar -czf "${name}.tar.gz" "$name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-arm64
          path: underthec-*-macos-arm64.tar.gz

  windows-amd64:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=toolchain/mingw-w64-toolchain.cmake -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j
      - run: |
          ver=${{ needs.version.outputs.version }}
          name=underthec-${ver}-windows-amd64
          mkdir "$name"
          cp build/underthec.exe build/underthec.scr LICENSE "$name"/
          zip -r "${name}.zip" "$name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-amd64
          path: underthec-*-windows-amd64.zip

  windows-arm64:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: install llvm-mingw toolchain
        run: |
          curl -sSLf -o llvm-mingw.tar.xz "https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/llvm-mingw-20260826-ucrt-ubuntu-22.04-x86_64.tar.xz"
          echo "cee8d2ce3da5145ce4dc882e70d0b0719a783d53a99752c60948fc0659975a65  llvm-mingw.tar.xz" | sha256sum -c -
          sudo tar -xJf llvm-mingw.tar.xz -C /opt
          echo "/opt/llvm-mingw-20260826-ucrt-ubuntu-22.04-x86_64/bin" >> "$GITHUB_PATH"
      - run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=toolchain/aarch64-w64-mingw32-toolchain.cmake -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j
      - run: |
          ver=${{ needs.version.outputs.version }}
          name=underthec-${ver}-windows-arm64
          mkdir "$name"
          cp build/underthec.exe build/underthec.scr LICENSE "$name"/
          zip -r "${name}.zip" "$name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-arm64
          path: underthec-*-windows-arm64.zip

  web:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y emscripten
      - run: emcmake cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j
      - run: |
          ver=${{ needs.version.outputs.version }}
          name=underthec-${ver}-web
          mkdir "$name"
          cp build/index.html build/underthec.js build/underthec.wasm LICENSE "$name"/
          zip -r "${name}.zip" "$name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web
          path: underthec-*-web.zip

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: install pinned SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: build signed apk
        working-directory: src/target/androidtv
        env:
          ORG_GRADLE_PROJECT_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ORG_GRADLE_PROJECT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          ./gradlew assembleRelease --no-daemon -PUNDERTHEC_NDK="$ANDROID_HOME/ndk/27.0.12077973"
      - run: |
          ver=${{ needs.version.outputs.version }}
          cp src/target/androidtv/build/outputs/apk/release/underthec-${ver}-androidtv-release.apk underthec-${ver}-androidtv.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android
          path: underthec-*-androidtv.apk

  release:
    needs: [version, linux, linux-musl-cross, macos-arm64, windows-amd64, windows-arm64, web, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: checksum summary
        run: |
          for f in dist/*; do
            base=$(basename "$f")
            echo "# $base"
            echo
            echo "| filename | checksum |"
            echo "|----|----|"
            tmp=$(mktemp -d)
            case "$base" in
              *.tar.gz) tar -xzf "$f" -C "$tmp" ;;
              *.zip) unzip -q "$f" -d "$tmp" ;;
              *) cp "$f" "$tmp"/ ;;
            esac
            (cd "$tmp" && find . -type f ! -name LICENSE | sed 's|^\./||' | sort | while read -r p; do
              printf '| %s | %s |\n' "${p#*/}" "$(sha256sum "$p" | cut -d' ' -f1)"
            done)
            echo
            rm -rf "$tmp"
          done >> "$GITHUB_STEP_SUMMARY"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
